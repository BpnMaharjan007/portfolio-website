<svg class="koopman" viewBox="-24.5 103.7 1149.2 719.4" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="koopman-lift-title koopman-lift-desc">
<title id="koopman-lift-title">The sine lift of a droop-controlled inverter's power angle</title>
<desc id="koopman-lift-desc">A three-quarter technical drawing in two levels. On the lower plane, spanned by power angle and frequency deviation, the inverter's trajectory spirals inward to equilibrium along a visibly curved path. Floating above it is a corrugated sheet, the graph of sine of the power angle. Vertical ties connect points on the lower trajectory to the matching points on the sheet, where the lifted trajectory runs along the corrugation. The curvature that makes the lower path nonlinear is carried by the shape of the sheet.</desc>
